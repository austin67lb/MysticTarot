<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic Tarot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
:root{--gold:#c9a84c;--gl:#f0d080;--gd:#8a6a1a;--bg:#0d0820;--panel:#1e1545;--acc:#7b4fa6;--acl:#a06fd4;--tx:#e8dfc8;--dm:#9a8fa8;--gw:rgba(201,168,76,.35);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:"Crimson Text",serif;min-height:100vh;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 20% 20%,rgba(123,79,166,.15),transparent 60%),
             radial-gradient(ellipse at 80% 80%,rgba(201,168,76,.08),transparent 60%);}
.w{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px;}
header{text-align:center;padding:28px 16px 20px;border-bottom:1px solid rgba(201,168,76,.2);margin-bottom:20px;position:relative;}
.lr{position:absolute;top:16px;right:0;display:flex;gap:4px;align-items:center;}
.lb{padding:6px 13px;border-radius:20px;border:1px solid rgba(201,168,76,.35);background:transparent;color:var(--dm);font-family:"Cinzel",serif;font-size:.7rem;letter-spacing:.08em;cursor:pointer;transition:.2s;}
.lb.on,.lb:hover{background:rgba(201,168,76,.18);border-color:var(--gold);color:var(--gold);}
.lsep{color:rgba(201,168,76,.3);}
h1{font-family:"Cinzel",serif;font-size:clamp(1.5rem,4vw,2.8rem);background:linear-gradient(135deg,var(--gd),var(--gl),var(--gd));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.12em;margin-bottom:4px;}
.sub{color:var(--dm);font-style:italic;font-size:.95rem;}

/* tabs */
.tabs{display:flex;border-bottom:1px solid rgba(201,168,76,.2);margin-bottom:20px;flex-wrap:wrap;}
.tb{padding:9px 18px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dm);font-family:"Cinzel",serif;font-size:.72rem;letter-spacing:.1em;cursor:pointer;transition:.2s;margin-bottom:-1px;white-space:nowrap;}
.tb.on{color:var(--gold);border-bottom-color:var(--gold);}
.pn{display:none;}.pn.on{display:block;}

/* box */
.bx{background:rgba(30,21,69,.75);border:1px solid rgba(201,168,76,.25);border-radius:14px;padding:20px;margin-bottom:20px;backdrop-filter:blur(8px);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:560px){.g2{grid-template-columns:1fr;}}
.cg label{display:block;font-family:"Cinzel",serif;font-size:.72rem;letter-spacing:.12em;color:var(--gold);margin-bottom:7px;text-transform:uppercase;}
.sw{position:relative;}
.sw::after{content:"\25BE";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none;}
select{width:100%;background:rgba(13,8,32,.85);border:1px solid rgba(201,168,76,.35);border-radius:8px;color:var(--tx);font-family:"Crimson Text",serif;font-size:.92rem;padding:8px 30px 8px 11px;appearance:none;cursor:pointer;}
select:focus{outline:none;border-color:var(--gold);}
select option{background:#1a1035;}
.dsc{font-size:.8rem;color:var(--dm);font-style:italic;margin-top:5px;min-height:2em;line-height:1.4;}
.btn{display:block;width:100%;padding:13px;background:linear-gradient(135deg,#4a2a7a,#6b3fa0,#4a2a7a);border:1px solid var(--gold);border-radius:9px;color:var(--gl);font-family:"Cinzel",serif;font-size:.95rem;letter-spacing:.15em;cursor:pointer;transition:.3s;box-shadow:0 4px 20px rgba(107,63,160,.4);}
.btn:hover{background:linear-gradient(135deg,#5a3a8a,#7b4fb0,#5a3a8a);box-shadow:0 6px 28px rgba(107,63,160,.6),0 0 18px var(--gw);transform:translateY(-2px);}
.btn:active{transform:none;}

/* reading */
.rh{text-align:center;margin-bottom:20px;}
.rt{font-family:"Cinzel",serif;font-size:1.2rem;color:var(--gold);letter-spacing:.1em;margin-bottom:3px;}
.rs{color:var(--dm);font-style:italic;font-size:.85rem;}
.ht{text-align:center;color:var(--dm);font-size:.8rem;font-style:italic;margin-bottom:16px;animation:fi 1s ease 1s both;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cg2{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:20px;}
.cs{display:flex;flex-direction:column;align-items:center;gap:7px;animation:ca .5s ease both;}
@keyframes ca{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.cp{font-family:"Cinzel",serif;font-size:.58rem;letter-spacing:.07em;color:var(--gold);text-transform:uppercase;text-align:center;max-width:120px;}

/* card flip */
.tc{width:120px;height:205px;border-radius:9px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1);flex-shrink:0;}
.tc.fl{transform:rotateY(180deg);}
.tc.rv.fl{transform:rotateY(180deg) rotate(180deg);}
.cf,.cb{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.cb{background:linear-gradient(145deg,#1e1545,#2d1f6e);border:2px solid rgba(201,168,76,.5);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.5);overflow:hidden;}
.cb::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,168,76,.3);border-radius:6px;}
.cbp{font-size:2.4rem;filter:drop-shadow(0 0 8px var(--gold));animation:pg 3s ease-in-out infinite;}
@keyframes pg{0%,100%{filter:drop-shadow(0 0 8px var(--gold))}50%{filter:drop-shadow(0 0 16px var(--gl))}}
.cf{transform:rotateY(180deg);border:2px solid rgba(201,168,76,.6);box-shadow:0 6px 20px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;background:#0d0820;}
.cfi{width:100%;flex:1;object-fit:cover;object-position:top;display:block;background:#1e1545;}
.cff{background:linear-gradient(to top,#0d0820 55%,rgba(13,8,32,.7));padding:5px 5px 7px;text-align:center;}
.cfn{font-family:"Cinzel",serif;font-size:.5rem;color:var(--gl);letter-spacing:.03em;line-height:1.3;font-weight:600;}
.cfr{font-size:.42rem;color:#c06060;letter-spacing:.05em;margin-top:2px;}
.tc:hover .cb{box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 16px var(--gw);}

/* summary */
.sb{background:rgba(30,21,69,.7);border:1px solid rgba(201,168,76,.2);border-radius:12px;padding:20px;margin-top:6px;}
.st{font-family:"Cinzel",serif;font-size:.9rem;color:var(--gold);letter-spacing:.1em;margin-bottom:12px;text-align:center;}
.sl{display:flex;flex-direction:column;gap:7px;}
.si{display:flex;align-items:center;gap:11px;padding:8px 11px;background:rgba(13,8,32,.4);border-radius:7px;border:1px solid rgba(201,168,76,.1);cursor:pointer;transition:.2s;}
.si:hover{border-color:rgba(201,168,76,.3);background:rgba(13,8,32,.6);}
.sth{width:32px;height:46px;border-radius:4px;object-fit:cover;object-position:top;border:1px solid rgba(201,168,76,.3);flex-shrink:0;background:#1e1545;}
.sif{flex:1;}
.sp{font-family:"Cinzel",serif;font-size:.58rem;color:var(--gold);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1px;}
.sn{font-size:.88rem;color:var(--tx);font-weight:600;}
.sr{font-size:.7rem;color:#c06060;font-style:italic;}
.sk{font-size:.74rem;color:var(--dm);font-style:italic;}

/* browse */
.br{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px;align-items:center;}
.bsr{flex:1;min-width:160px;background:rgba(13,8,32,.85);border:1px solid rgba(201,168,76,.35);border-radius:8px;color:var(--tx);font-family:"Crimson Text",serif;font-size:.9rem;padding:8px 12px;}
.bsr:focus{outline:none;border-color:var(--gold);}
.bsr::placeholder{color:var(--dm);}
.bfw{position:relative;}
.bfw::after{content:"\25BE";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none;}
.bf{background:rgba(13,8,32,.85);border:1px solid rgba(201,168,76,.35);border-radius:8px;color:var(--tx);font-family:"Crimson Text",serif;font-size:.88rem;padding:8px 26px 8px 11px;appearance:none;cursor:pointer;}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;}
.bc{cursor:pointer;border-radius:9px;overflow:hidden;border:2px solid rgba(201,168,76,.2);transition:.2s;background:#1e1545;}
.bc:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.5),0 0 14px var(--gw);}
.bc img{width:100%;height:140px;object-fit:cover;object-position:top;display:block;background:#1e1545;}
.bcn{font-family:"Cinzel",serif;font-size:.48rem;color:var(--gl);text-align:center;padding:5px 3px;line-height:1.3;}

/* ── FLIP-THROUGH TAB ── */
.ft-wrap{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
.ft-left{display:flex;flex-direction:column;align-items:center;gap:14px;flex-shrink:0;}
.ft-card-big{width:160px;height:274px;border-radius:12px;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1);cursor:pointer;flex-shrink:0;}
.ft-card-big.fl{transform:rotateY(180deg);}
.ft-cb,.ft-cf{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.ft-cb{background:linear-gradient(145deg,#1e1545,#2d1f6e);border:2px solid rgba(201,168,76,.5);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,.6);}
.ft-cb::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,168,76,.3);border-radius:9px;}
.ft-cbp{font-size:3.2rem;filter:drop-shadow(0 0 10px var(--gold));animation:pg 3s ease-in-out infinite;}
.ft-cf{transform:rotateY(180deg);border:2px solid rgba(201,168,76,.6);box-shadow:0 8px 28px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;background:#0d0820;}
.ft-cfi{width:100%;flex:1;object-fit:cover;object-position:top;display:block;background:#1e1545;}
.ft-cff{background:linear-gradient(to top,#0d0820 60%,rgba(13,8,32,.7));padding:6px 6px 9px;text-align:center;}
.ft-cfn{font-family:"Cinzel",serif;font-size:.62rem;color:var(--gl);letter-spacing:.04em;line-height:1.3;font-weight:600;}
.ft-cfr{font-size:.52rem;color:#c06060;letter-spacing:.06em;margin-top:3px;}
.ft-nav{display:flex;gap:10px;align-items:center;}
.ft-nb{background:rgba(30,21,69,.8);border:1px solid rgba(201,168,76,.35);color:var(--gold);font-family:"Cinzel",serif;font-size:.7rem;letter-spacing:.08em;padding:8px 16px;border-radius:20px;cursor:pointer;transition:.2s;}
.ft-nb:hover{background:rgba(201,168,76,.18);border-color:var(--gold);}
.ft-nb:disabled{opacity:.35;cursor:not-allowed;}
.ft-ctr{font-family:"Cinzel",serif;font-size:.72rem;color:var(--dm);letter-spacing:.06em;min-width:60px;text-align:center;}
.ft-hint{font-size:.78rem;color:var(--dm);font-style:italic;text-align:center;}
.ft-right{flex:1;min-width:260px;}
.ft-name{font-family:"Cinzel",serif;font-size:1.4rem;color:var(--gl);letter-spacing:.06em;margin-bottom:4px;}
.ft-meta{font-size:.88rem;color:var(--dm);font-style:italic;margin-bottom:14px;}
.ft-kws{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.ft-kw{background:rgba(123,79,166,.25);border:1px solid rgba(123,79,166,.4);color:var(--acl);font-size:.76rem;padding:3px 9px;border-radius:20px;font-style:italic;}
.ft-sec{margin-bottom:14px;}
.ft-sec-title{font-family:"Cinzel",serif;font-size:.7rem;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:7px;}
.ft-sec-title::after{content:"";flex:1;height:1px;background:rgba(201,168,76,.2);}
.ft-sec p{font-size:.94rem;line-height:1.7;color:var(--tx);}
.ft-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--dm);font-style:italic;font-size:.95rem;gap:12px;}
.ft-placeholder .es{font-size:2.8rem;opacity:.4;}
/* filter row for flip-through */
.ft-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.ft-filters label{font-family:"Cinzel",serif;font-size:.7rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;}
.ft-fsw{position:relative;}
.ft-fsw::after{content:"\25BE";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none;}
.ft-fsel{background:rgba(13,8,32,.85);border:1px solid rgba(201,168,76,.35);border-radius:8px;color:var(--tx);font-family:"Crimson Text",serif;font-size:.88rem;padding:7px 26px 7px 11px;appearance:none;cursor:pointer;}
.ft-shuffle{background:rgba(30,21,69,.8);border:1px solid rgba(201,168,76,.35);color:var(--dm);font-family:"Cinzel",serif;font-size:.7rem;letter-spacing:.08em;padding:7px 14px;border-radius:20px;cursor:pointer;transition:.2s;}
.ft-shuffle:hover{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold);}

/* modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .3s;}
.mo.on{opacity:1;pointer-events:all;}
.md{background:linear-gradient(145deg,#1e1545,#2a1a5e);border:1px solid rgba(201,168,76,.4);border-radius:18px;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.7);transform:scale(.9) translateY(18px);transition:transform .3s;scrollbar-width:thin;scrollbar-color:var(--gd) transparent;}
.mo.on .md{transform:scale(1) translateY(0);}
.miw{position:relative;height:210px;overflow:hidden;border-radius:16px 16px 0 0;}
.mi{width:100%;height:100%;object-fit:cover;object-position:top;background:#1e1545;}
.mio{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,rgba(13,8,32,.96));}
.mit{position:absolute;bottom:12px;left:18px;right:50px;}
.mn{font-family:"Cinzel",serif;font-size:1.2rem;color:var(--gl);letter-spacing:.05em;margin-bottom:2px;}
.mm{font-size:.82rem;color:var(--dm);font-style:italic;}
.mrt{display:inline-block;background:rgba(192,96,96,.2);border:1px solid rgba(192,96,96,.4);color:#e08080;font-family:"Cinzel",serif;font-size:.6rem;letter-spacing:.07em;padding:2px 7px;border-radius:4px;margin-top:4px;}
.mcl{position:absolute;top:12px;right:12px;background:rgba(13,8,32,.75);border:1px solid rgba(201,168,76,.4);color:var(--dm);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:.2s;z-index:2;}
.mcl:hover{border-color:var(--gold);color:var(--gold);}
.mb{padding:18px 22px 22px;}
.ms{margin-bottom:16px;}
.mst{font-family:"Cinzel",serif;font-size:.7rem;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:7px;}
.mst::after{content:"";flex:1;height:1px;background:rgba(201,168,76,.2);}
.ms p{font-size:.94rem;line-height:1.7;color:var(--tx);}
.kwl{display:flex;flex-wrap:wrap;gap:6px;}
.kw{background:rgba(123,79,166,.25);border:1px solid rgba(123,79,166,.4);color:var(--acl);font-size:.76rem;padding:3px 9px;border-radius:20px;font-style:italic;}
.pctx{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:7px;padding:9px 13px;font-size:.85rem;color:var(--dm);font-style:italic;margin-bottom:16px;}
.mnv{display:flex;justify-content:space-between;align-items:center;padding:11px 22px;border-top:1px solid rgba(201,168,76,.15);}
.mnb{background:rgba(30,21,69,.8);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-family:"Cinzel",serif;font-size:.68rem;letter-spacing:.07em;padding:6px 14px;border-radius:20px;cursor:pointer;transition:.2s;}
.mnb:hover{background:rgba(201,168,76,.15);border-color:var(--gold);}
.mnc{font-family:"Cinzel",serif;font-size:.7rem;color:var(--dm);letter-spacing:.05em;}
.emp{text-align:center;padding:50px 20px;color:var(--dm);}
.emp .es{font-size:3.2rem;margin-bottom:12px;opacity:.5;}
.emp p{font-style:italic;}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--gd);border-radius:3px}
@media(max-width:440px){.tc{width:100px;height:172px}.cfn{font-size:.46rem}.ft-card-big{width:130px;height:222px}}
</style>
</head>
<body>
<div class="w">
<header>
  <div class="lr">
    <button class="lb on" id="bEN" onclick="setLang('en')">EN</button>
    <span class="lsep">|</span>
    <button class="lb" id="bRU" onclick="setLang('ru')">RU</button>
  </div>
  <div style="font-size:2rem;margin-bottom:6px;filter:drop-shadow(0 0 10px var(--gold))">&#127769;</div>
  <h1 id="T_title">&#10024; MYSTIC TAROT &#10024;</h1>
  <p class="sub" id="T_sub">Unveil the wisdom of the cards</p>
</header>

<div class="tabs">
  <button class="tb on" id="tab_read" onclick="showTab('read')">&#10022; Reading</button>
  <button class="tb" id="tab_flip" onclick="showTab('flip')">&#10022; Flip Through</button>
  <button class="tb" id="tab_browse" onclick="showTab('browse')">&#10022; Browse All Cards</button>
</div>

<!-- READING -->
<div class="pn on" id="pn_read">
  <div class="bx">
    <div class="g2">
      <div class="cg">
        <label id="T_ll">&#10022; Spread Layout</label>
        <div class="sw"><select id="sl" onchange="onLC()">
          <option value="single">Single Card</option>
          <option value="three_ppp">Three Card &#8212; Past &#183; Present &#183; Future</option>
          <option value="three_smc">Three Card &#8212; Situation &#183; Message &#183; Outcome</option>
          <option value="three_mbo">Three Card &#8212; Mind &#183; Body &#183; Spirit</option>
          <option value="celtic">Celtic Cross (10 Cards)</option>
          <option value="horseshoe">Horseshoe (7 Cards)</option>
          <option value="love">Relationship Spread (5 Cards)</option>
          <option value="year">Year Ahead (12 Cards)</option>
          <option value="custom">Custom Pull</option>
        </select></div>
        <div class="dsc" id="ldesc"></div>
      </div>
      <div class="cg" id="cg_cust" style="display:none">
        <label id="T_lc">&#10022; Number of Cards</label>
        <div class="sw"><select id="sc">
          <option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option>
          <option value="8">8</option><option value="9">9</option><option value="10">10</option>
          <option value="11">11</option><option value="12">12</option>
        </select></div>
      </div>
      <div class="cg">
        <label id="T_ld">&#10022; Deck</label>
        <div class="sw"><select id="sd">
          <option value="full">Full Deck (78 Cards)</option>
          <option value="major">Major Arcana Only (22)</option>
          <option value="minor">Minor Arcana Only (56)</option>
          <option value="wands">Suit of Wands</option>
          <option value="cups">Suit of Cups</option>
          <option value="swords">Suit of Swords</option>
          <option value="pentacles">Suit of Pentacles</option>
        </select></div>
      </div>
      <div class="cg">
        <label id="T_lr">&#10022; Reversed Cards</label>
        <div class="sw"><select id="sr">
          <option value="none">No Reversed Cards</option>
          <option value="some">Allow Reversed (33%)</option>
          <option value="half">Half Reversed (50%)</option>
        </select></div>
      </div>
    </div>
    <button class="btn" id="T_btn" onclick="doPull()">&#10024; Draw the Cards &#10024;</button>
  </div>
  <div id="ra"><div class="emp"><div class="es">&#128302;</div><p id="T_emp">Shuffle the deck and draw your cards to begin your reading&#8230;</p></div></div>
</div>

<!-- FLIP THROUGH -->
<div class="pn" id="pn_flip">
  <div class="bx">
    <div class="ft-filters">
      <label id="T_ftf">&#10022; Show</label>
      <div class="ft-fsw"><select class="ft-fsel" id="ft_filter" onchange="ftFilter()">
        <option value="all">All 78 Cards</option>
        <option value="Major">Major Arcana</option>
        <option value="Wands">Wands</option>
        <option value="Cups">Cups</option>
        <option value="Swords">Swords</option>
        <option value="Pentacles">Pentacles</option>
      </select></div>
      <button class="ft-shuffle" onclick="ftShuffle()" id="T_ftshuffle">&#9654; Shuffle Order</button>
      <button class="ft-shuffle" onclick="ftReset()" id="T_ftreset">&#8635; Reset Order</button>
    </div>
    <div class="ft-wrap">
      <div class="ft-left">
        <div class="ft-card-big" id="ft_card" onclick="ftFlip()">
          <div class="ft-cb"><div class="ft-cbp">&#10022;</div></div>

  $("T_ftshuffle").textContent=t.ftshuffle;
  $("T_ftreset").textContent=t.ftreset;
  $("T_fthint").textContent=t.fthint;
  $("T_ftph").textContent=t.ftph;
  setSel("sl",t.lo);setSel("sd",t.do);setSel("sr",t.ro);setSel("bsf",t.fo);setSel("ft_filter",t.ftfo);
}
function setSel(id,map){
  var s=$(id);if(!s)return;var cur=s.value;
  Array.from(s.options).forEach(function(o){if(map[o.value]!==undefined)o.textContent=map[o.value];});
  s.value=cur;
}

// ── TABS ─────────────────────────────────────────────────────
function showTab(n){
  ["read","flip","browse"].forEach(function(x){
    $("pn_"+x).classList.toggle("on",x===n);
    $("tab_"+x).classList.toggle("on",x===n);
  });
  if(n==="browse")renderBrowse();
  if(n==="flip")ftInit();
}

// ── LAYOUT ───────────────────────────────────────────────────
function onLC(){
  var v=$("sl").value;
  $("ldesc").textContent=TR[lang].ld[v]||"";
  $("cg_cust").style.display=v==="custom"?"block":"none";
}

// ── DECK ─────────────────────────────────────────────────────
function getDeck(){
  var v=$("sd").value;
  if(v==="major")return CARDS.filter(function(c){return c.arcana_en==="Major";});
  if(v==="minor")return CARDS.filter(function(c){return c.arcana_en==="Minor";});
  if(v==="wands")return CARDS.filter(function(c){return c.suit_en==="Wands";});
  if(v==="cups")return CARDS.filter(function(c){return c.suit_en==="Cups";});
  if(v==="swords")return CARDS.filter(function(c){return c.suit_en==="Swords";});
  if(v==="pentacles")return CARDS.filter(function(c){return c.suit_en==="Pentacles";});
  return CARDS.slice();
}
function doRev(){
  var v=$("sr").value;
  if(v==="none")return false;
  if(v==="some")return Math.random()<0.33;
  return Math.random()<0.5;
}

// ── PULL ─────────────────────────────────────────────────────
function doPull(){
  var lk=$("sl").value,pos=TR[lang].lp[lk],deck=getDeck();
  var count=pos?pos.length:parseInt($("sc").value);
  if(deck.length<count){alert(tx("ne"));return;}
  var sh=deck.slice().sort(function(){return Math.random()-.5;});
  reading=sh.slice(0,count).map(function(c,i){
    return{card:c,reversed:doRev(),position:pos?pos[i]:(lang==="en"?"Card ":"\u041a\u0430\u0440\u0442\u0430 ")+(i+1)};
  });
  renderReading();
}
function cn(c){return lang==="en"?c.name_en:c.name_ru;}

// ── RENDER READING ───────────────────────────────────────────
function renderReading(){
  var lk=$("sl").value,ln=TR[lang].lo[lk]||lk;
  if(lk==="custom")ln=lang==="en"?"Custom "+reading.length+"-Card Pull":"\u041f\u0440\u043e\u0438\u0437\u0432\u043e\u043b\u044c\u043d\u044b\u0439 \u0440\u0430\u0441\u043a\u043b\u0430\u0434 ("+reading.length+" \u043a\u0430\u0440\u0442)";
  var h="<div class='rh'><div class='rt'>\u2726 "+e(ln)+" \u2726</div><div class='rs'>"+e(tx("rsub"))+"</div></div>"
    +"<p class='ht'>"+e(tx("hint"))+"</p><div class='cg2'>";
  reading.forEach(function(item,i){
    var n=cn(item.card),fb=makeFB(item.card,120,205);
    h+="<div class='cs' style='animation-delay:"+(i*0.07)+"s'>"
      +"<div class='cp'>"+e(item.position)+"</div>"
      +"<div class='tc' id='rc"+i+"' onclick='flipC("+i+")'>"
      +"<div class='cb'><div class='cbp'>\u2726</div></div>"
      +"<div class='cf'>"
      +"<img class='cfi' src='"+item.card.img+"' alt='"+e(n)+"' loading='lazy' onerror=\"this.src='"+fb+"'\">"
      +"<div class='cff'><div class='cfn'>"+e(n)+"</div>"
      +(item.reversed?"<div class='cfr'>"+e(lang==="en"?"\u2193 REVERSED":"\u2193 \u041f\u0415\u0420\u0415\u0412\u0401\u0420\u041d\u0423\u0422\u0410\u042f")+"</div>":"")
      +"</div></div></div></div>";
  });
  h+="</div><div class='sb'><div class='st'>\u2726 "+e(tx("glance"))+" \u2726</div><div class='sl'>";
  reading.forEach(function(item,i){
    var n=cn(item.card),kw=(lang==="en"?item.card.kw_en:item.card.kw_ru).join(" \u00b7 ");
    var fb=makeFB(item.card,32,46);
    h+="<div class='si' onclick='openRM("+i+")'>"
      +"<img class='sth' src='"+item.card.img+"' alt='"+e(n)+"' loading='lazy' onerror=\"this.src='"+fb+"'\">"
      +"<div class='sif'><div class='sp'>"+e(item.position)+"</div>"
      +"<div class='sn'>"+e(n)+(item.reversed?" <span class='sr'>("+e(tx("rev"))+")</span>":"")+"</div>"
      +"<div class='sk'>"+e(kw)+"</div></div>"
      +"<div style='color:var(--dm);font-size:.8rem;align-self:center'>\u2192</div></div>";
  });
  h+="</div></div>";
  $("ra").innerHTML=h;
}
function flipC(i){
  var el=$("rc"+i);if(!el)return;
  if(!el.classList.contains("fl")){
    el.classList.add("fl");
    if(reading[i].reversed)el.classList.add("rv");
    el.onclick=null;
    setTimeout(function(){el.onclick=function(){openRM(i);};},720);
  }else{openRM(i);}
}
function openRM(i){
  mMode="reading";
  fillM(reading[i].card,reading[i].reversed,reading[i].position);
  $("mnav").style.display="none";showM();
}

// ── FLIP-THROUGH ─────────────────────────────────────────────
function ftGetDeck(){
  var f=$("ft_filter").value;
  if(f==="Major")return CARDS.filter(function(c){return c.arcana_en==="Major";});
  if(f==="Wands")return CARDS.filter(function(c){return c.suit_en==="Wands";});
  if(f==="Cups")return CARDS.filter(function(c){return c.suit_en==="Cups";});
  if(f==="Swords")return CARDS.filter(function(c){return c.suit_en==="Swords";});
  if(f==="Pentacles")return CARDS.filter(function(c){return c.suit_en==="Pentacles";});
  return CARDS.slice();
}

function ftInit(){
  if(!ftDeck.length){ftDeck=ftGetDeck();ftIdx=0;}
  ftFlipped=false;
  ftRenderCard();
  ftRenderInfo();
}

function ftFilter(){
  ftDeck=ftGetDeck();ftIdx=0;ftFlipped=false;
  ftRenderCard();ftRenderInfo();
}

function ftShuffle(){
  ftDeck=ftDeck.slice().sort(function(){return Math.random()-.5;});
  ftIdx=0;ftFlipped=false;
  ftRenderCard();ftRenderInfo();
}

function ftReset(){
  ftDeck=ftGetDeck();ftIdx=0;ftFlipped=false;
  ftRenderCard();ftRenderInfo();
}

function ftNav(d){
  ftIdx=(ftIdx+d+ftDeck.length)%ftDeck.length;
  ftFlipped=false;
  // Reset card to face-down
  var card=$("ft_card");
  card.classList.remove("fl");
  ftRenderCard();
  ftRenderInfo();
}

function ftFlip(){
  var card=$("ft_card");
  if(!ftFlipped){
    card.classList.add("fl");
    ftFlipped=true;
    ftRenderInfo();
  } else {
    // clicking again opens full modal
    var c=ftDeck[ftIdx];
    mMode="browse";
    fillM(c,false,null);
    $("mnav").style.display="none";
    showM();
  }
}

function ftImgFail(){
  var c=ftDeck[ftIdx];
  if(!c)return;
  $("ft_img").src=makeFB(c,160,274);
}

function ftRenderCard(){
  var c=ftDeck[ftIdx];
  if(!c)return;
  var n=cn(c);
  var fb=makeFB(c,160,274);
  $("ft_img").src=c.img;
  $("ft_img").onerror=function(){this.src=fb;};
  $("ft_cfn").textContent=n;
  $("ft_cfr").textContent="";
  $("ft_ctr").textContent=(ftIdx+1)+" / "+ftDeck.length;
  $("ft_prev").disabled=false;
  $("ft_next").disabled=false;
}

function ftRenderInfo(){
  var c=ftDeck[ftIdx];
  if(!c){$("ft_info").innerHTML="";return;}
  var n=cn(c);
  var arc=lang==="en"?c.arcana_en:c.arcana_ru;
  var suit=c.suit_en?(lang==="en"?c.suit_en:c.suit_ru):null;
  var meta=suit?arc+" \u00b7 "+suit+" \u00b7 "+c.number:arc+" \u00b7 "+c.number;

  if(!ftFlipped){
    $("ft_info").innerHTML="<div class='ft-placeholder'><div class='es'>"+c.symbol+"</div><p id='T_ftph'>"+e(tx("ftph"))+"</p></div>";
    return;
  }

  var kw=lang==="en"?c.kw_en:c.kw_ru;
  var kwHtml=kw.map(function(k){return "<span class='ft-kw'>"+e(k)+"</span>";}).join("");
  var h="<div class='ft-name'>"+e(n)+"</div>"
    +"<div class='ft-meta'>"+e(meta)+"</div>"
    +"<div class='ft-kws'>"+kwHtml+"</div>"
    +"<div class='ft-sec'><div class='ft-sec-title'>"+e(tx("ftup"))+"</div><p>"+(lang==="en"?c.upright_en:c.upright_ru)+"</p></div>"
    +"<div class='ft-sec'><div class='ft-sec-title'>"+e(tx("ftrv"))+"</div><p>"+(lang==="en"?c.reversed_en:c.reversed_ru)+"</p></div>"
    +"<div class='ft-sec'><div class='ft-sec-title'>"+e(tx("ftsy"))+"</div><p>"+(lang==="en"?c.symbolism_en:c.symbolism_ru)+"</p></div>"
    +"<div class='ft-sec'><div class='ft-sec-title'>"+e(tx("ftad"))+"</div><p>"+(lang==="en"?c.advice_en:c.advice_ru)+"</p></div>";
  $("ft_info").innerHTML=h;
}

// ── BROWSE ───────────────────────────────────────────────────
function renderBrowse(){
  var q=$("bsq").value.toLowerCase(),f=$("bsf").value;
  bList=CARDS.filter(function(c){
    var n=(lang==="en"?c.name_en:c.name_ru).toLowerCase();
    var kw=(lang==="en"?c.kw_en:c.kw_ru).join(" ").toLowerCase();
    return(!q||n.indexOf(q)>=0||kw.indexOf(q)>=0)&&(f==="all"||c.arcana_en===f||c.suit_en===f);
  });
  var g=$("bgrid");
  if(!bList.length){g.innerHTML="<div style='grid-column:1/-1;text-align:center;color:var(--dm);font-style:italic;padding:30px'>"+e(tx("none"))+"</div>";return;}
  g.innerHTML=bList.map(function(c,i){
    var n=lang==="en"?c.name_en:c.name_ru,fb=makeFB(c,100,140);
    return "<div class='bc' onclick='openBM("+i+")'><img src='"+c.img+"' alt='"+e(n)+"' loading='lazy' onerror=\"this.src='"+fb+"'\"><div class='bcn'>"+e(n)+"</div></div>";
  }).join("");
}
function openBM(i){
  mMode="browse";bIdx=i;
  fillM(bList[i],false,null);
  $("mnav").style.display="flex";
  $("mctr").textContent=(i+1)+" / "+bList.length;
  showM();
}
function bNav(d){
  bIdx=(bIdx+d+bList.length)%bList.length;
  fillM(bList[bIdx],false,null);
  $("mctr").textContent=(bIdx+1)+" / "+bList.length;
}

// ── MODAL ────────────────────────────────────────────────────
function fillM(card,rev,pos){
  var n=lang==="en"?card.name_en:card.name_ru;
  var arc=lang==="en"?card.arcana_en:card.arcana_ru;
  var suit=card.suit_en?(lang==="en"?card.suit_en:card.suit_ru):null;
  var fb=makeFB(card,580,210);
  $("mimg").src=card.img;$("mimg").alt=n;
  $("mimg").onerror=function(){this.src=fb;};
  $("mname").textContent=n;
  $("mmeta").textContent=suit?arc+" \u00b7 "+suit+" \u00b7 "+card.number:arc+" \u00b7 "+card.number;
  $("mrev").innerHTML=rev?"<span class='mrt'>"+e(lang==="en"?"\u2193 REVERSED":"\u2193 \u041f\u0415\u0420\u0415\u0412\u0401\u0420\u041d\u0423\u0422\u0410\u042f")+"</span>":"";
  var pc=$("mpos");
  if(pos){pc.textContent=tx("pos")+pos;pc.style.display="block";}else{pc.style.display="none";}
  var kw=lang==="en"?card.kw_en:card.kw_ru;
  $("mkw").innerHTML=kw.map(function(k){return "<span class='kw'>"+e(k)+"</span>";}).join("");
  $("mup").textContent=lang==="en"?card.upright_en:card.upright_ru;
  $("mrv").textContent=lang==="en"?card.reversed_en:card.reversed_ru;
  $("msy").textContent=lang==="en"?card.symbolism_en:card.symbolism_ru;
  $("mad").textContent=lang==="en"?card.advice_en:card.advice_ru;
  $("T_kw").textContent=tx("kw");$("T_up").textContent=tx("up");
  $("T_rv").textContent=tx("rv");$("T_sy").textContent=tx("sy");$("T_ad").textContent=tx("ad");
  $("T_prev").textContent=tx("prev");$("T_next").textContent=tx("next");
}
function showM(){$("moverlay").classList.add("on");document.body.style.overflow="hidden";}
function closeM(){$("moverlay").classList.remove("on");document.body.style.overflow="";}
function closeMBg(ev){if(ev.target===$("moverlay"))closeM();}

function e(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape")closeM();
  // Flip-through keyboard nav (only when flip tab is active and modal closed)
  if(!$("moverlay").classList.contains("on")&&$("pn_flip").classList.contains("on")){
    if(ev.key==="ArrowRight"){ftNav(1);}
    if(ev.key==="ArrowLeft"){ftNav(-1);}
    if(ev.key===" "||ev.key==="Enter"){ev.preventDefault();ftFlip();}
  }
  // Browse modal nav
  if($("moverlay").classList.contains("on")&&mMode==="browse"){
    if(ev.key==="ArrowRight")bNav(1);
    if(ev.key==="ArrowLeft")bNav(-1);
  }
});

onLC();renderBrowse();
</script>
</body>
</html>
